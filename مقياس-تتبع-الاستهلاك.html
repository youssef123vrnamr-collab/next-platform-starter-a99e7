<style>
  :root{
    --bg: #0a0e1a;
    --bg-elevated: #11172a;
    --surface: #161d35;
    --surface-hover: #1c2540;
    --border: #232c4a;
    --signal: #22d3ee;
    --signal-dim: #0891b2;
    --signal-glow: rgba(34, 211, 238, 0.15);
    --warn: #f59e0b;
    --danger: #f43f5e;
    --text: #e8ecf5;
    --text-dim: #8b93b0;
    --text-faint: #5a6180;
    --font-display: "Tahoma", "Segoe UI", sans-serif;
    --font-body: "Segoe UI", "Tahoma", sans-serif;
    --font-mono: "Consolas", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-image:
      radial-gradient(ellipse 800px 400px at 50% -100px, var(--signal-glow), transparent);
    padding-bottom: 100px;
  }

  /* ===== Header / Signature element: signal-bar meter ===== */
  header {
    padding: 28px 20px 20px;
    position: relative;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .brand-mark {
    width: 30px;
    height: 22px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }
  .brand-mark span {
    width: 5px;
    background: var(--signal);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--signal-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .brand-mark span:nth-child(1){ height: 30%; animation-delay: 0s; }
  .brand-mark span:nth-child(2){ height: 55%; animation-delay: .2s; }
  .brand-mark span:nth-child(3){ height: 80%; animation-delay: .4s; }
  .brand-mark span:nth-child(4){ height: 100%; animation-delay: .6s; }
  @keyframes pulse {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }

  .brand-name {
    font-size: 15px;
    letter-spacing: .12em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 600;
  }

  .total-gauge {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
  }
  .total-gauge::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--signal-glow), transparent 60%);
    pointer-events: none;
  }
  .total-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .08em;
    margin-bottom: 6px;
  }
  .total-value {
    font-size: 40px;
    font-weight: 700;
    font-family: var(--font-mono);
    color: var(--text);
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .total-value .unit { font-size: 16px; color: var(--signal); font-weight: 600; }
  .total-sub {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
  }
  .total-sub b { color: var(--text-dim); font-weight: 600; }

  /* ===== Period tabs ===== */
  .period-tabs {
    display: flex;
    gap: 8px;
    padding: 16px 20px 0;
  }
  .period-tab {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s ease;
  }
  .period-tab.active {
    background: var(--signal);
    color: #04202a;
    border-color: var(--signal);
    font-weight: 700;
  }

  /* ===== App list ===== */
  main { padding: 20px; }

  .section-title {
    font-size: 13px;
    color: var(--text-faint);
    letter-spacing: .06em;
    margin: 22px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .app-card:active { background: var(--surface-hover); }

  .app-dial {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .app-dial svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .app-dial-icon { font-size: 20px; z-index: 1; }

  .app-info { flex: 1; min-width: 0; }
  .app-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-meta {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 3px;
  }
  .app-meta.warn { color: var(--warn); }
  .app-meta.danger { color: var(--danger); }

  .app-amount {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    text-align: left;
    flex-shrink: 0;
  }
  .app-amount .u { font-size: 11px; color: var(--text-faint); font-weight: 500; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-faint);
  }
  .empty-state .glyph { font-size: 34px; margin-bottom: 10px; opacity: .5; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  /* ===== FAB ===== */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 20px;
    right: 20px;
    background: var(--signal);
    color: #04202a;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(34,211,238,.25);
    cursor: pointer;
    z-index: 30;
  }
  .fab:active { transform: scale(.98); }

  /* ===== Modal ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,8,16,.7);
    backdrop-filter: blur(3px);
    z-index: 40;
    display: none;
    align-items: flex-end;
  }
  .overlay.show { display: flex; }

  .sheet {
    background: var(--bg-elevated);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 18px;
  }
  .sheet h2 { font-size: 18px; margin-bottom: 18px; color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--signal); }

  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .btn-primary {
    width: 100%;
    background: var(--signal);
    color: #04202a;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
    cursor: pointer;
  }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
    font-size: 14px;
    margin-top: 8px;
    cursor: pointer;
  }
  .btn-danger-text {
    width: 100%;
    background: transparent;
    color: var(--danger);
    border: none;
    padding: 13px;
    font-size: 13px;
    margin-top: 4px;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    top: 18px; left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    z-index: 60;
    transition: transform .25s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
    <div class="brand-name">مقياس</div>
  </div>

  <div class="total-gauge">
    <div class="total-label">إجمالي الاستهلاك المسجّل</div>
    <div class="total-value"><span id="totalVal">0</span><span class="unit" id="totalUnit">MB</span></div>
    <div class="total-sub">
      <span>عدد التطبيقات: <b id="appCount">0</b></span>
      <span>آخر تسجيل: <b id="lastEntry">—</b></span>
    </div>
  </div>
</header>

<div class="period-tabs">
  <div class="period-tab active" data-period="all">كل الوقت</div>
  <div class="period-tab" data-period="month">هذا الشهر</div>
  <div class="period-tab" data-period="week">آخر 7 أيام</div>
</div>

<main>
  <div class="section-title">
    <span>التطبيقات</span>
  </div>
  <div id="appList"></div>
</main>

<button class="fab" id="openAdd">
  <span style="font-size:18px;">＋</span> تسجيل استهلاك جديد
</button>

<!-- Add / Edit entry sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>تسجيل استهلاك</h2>
    <div class="field">
      <label>اسم التطبيق</label>
      <input type="text" id="appNameInput" placeholder="مثال: واتساب، انستجرام...">
    </div>
    <div class="row2">
      <div class="field">
        <label>الكمية</label>
        <input type="number" id="amountInput" placeholder="0" inputmode="decimal">
      </div>
      <div class="field">
        <label>الوحدة</label>
        <select id="unitInput">
          <option value="MB">ميجابايت (MB)</option>
          <option value="GB">جيجابايت (GB)</option>
          <option value="KB">كيلوبايت (KB)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>التاريخ</label>
      <input type="date" id="dateInput">
    </div>
    <button class="btn-primary" id="saveEntry">حفظ</button>
    <button class="btn-secondary" id="cancelAdd">إلغاء</button>
  </div>
</div>

<!-- App detail sheet -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="detailName">—</h2>
    <div class="field">
      <label>الحد الشهري التنبيهي (اختياري، بالميجابايت)</label>
      <input type="number" id="limitInput" placeholder="مثال: 2000" inputmode="decimal">
    </div>
    <button class="btn-primary" id="saveLimit">حفظ الحد</button>
    <button class="btn-danger-text" id="deleteApp">حذف كل بيانات هذا التطبيق</button>
    <button class="btn-secondary" id="closeDetail">إغلاق</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "miqyas_entries_v1";
  var LIMIT_KEY = "miqyas_limits_v1";

  var entries = load(STORE_KEY, []);
  var limits = load(LIMIT_KEY, {});
  var currentPeriod = "all";
  var activeAppForDetail = null;

  function load(key, fallback){
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch(e){ return fallback; }
  }
  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(entries));
      localStorage.setItem(LIMIT_KEY, JSON.stringify(limits));
    } catch(e){ toast("تعذر الحفظ - المساحة ممتلئة"); }
  }

  function toMB(amount, unit){
    if(unit === "GB") return amount * 1024;
    if(unit === "KB") return amount / 1024;
    return amount;
  }

  function fmt(mb){
    if(mb >= 1024) return (mb/1024).toFixed(2) + " GB";
    if(mb < 1) return Math.round(mb*1024) + " KB";
    return mb.toFixed(mb < 10 ? 2 : 1) + " MB";
  }

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function filteredEntries(){
    if(currentPeriod === "all") return entries;
    var now = new Date();
    var cutoff;
    if(currentPeriod === "month"){
      cutoff = new Date(now.getFullYear(), now.getMonth(), 1);
    } else {
      cutoff = new Date(now.getTime() - 7*24*3600*1000);
    }
    return entries.filter(function(e){ return new Date(e.date) >= cutoff; });
  }

  function groupByApp(list){
    var groups = {};
    list.forEach(function(e){
      if(!groups[e.app]) groups[e.app] = { total: 0, lastDate: e.date };
      groups[e.app].total += toMB(e.amount, e.unit);
      if(e.date > groups[e.app].lastDate) groups[e.app].lastDate = e.date;
    });
    return groups;
  }

  var ICONS = ["📱","💬","🎵","🎬","📷","🎮","🗺️","🛍️","📧","🌐","☁️","📰"];
  function iconFor(name){
    var sum = 0;
    for(var i=0;i<name.length;i++) sum += name.charCodeAt(i);
    return ICONS[sum % ICONS.length];
  }

  function render(){
    var list = filteredEntries();
    var groups = groupByApp(list);
    var names = Object.keys(groups).sort(function(a,b){ return groups[b].total - groups[a].total; });

    var grandTotal = 0;
    names.forEach(function(n){ grandTotal += groups[n].total; });

    var totalDisplay = fmt(grandTotal).split(" ");
    document.getElementById("totalVal").textContent = totalDisplay[0];
    document.getElementById("totalUnit").textContent = totalDisplay[1] || "MB";
    document.getElementById("appCount").textContent = names.length;

    var lastDate = entries.length ? entries.reduce(function(a,b){ return a.date > b.date ? a : b; }).date : "—";
    document.getElementById("lastEntry").textContent = lastDate;

    var container = document.getElementById("appList");
    container.innerHTML = "";

    if(names.length === 0){
      container.innerHTML =
        '<div class="empty-state"><div class="glyph">📶</div>' +
        '<p>لسه معندكش أي تسجيل.<br>اضغط "تسجيل استهلاك جديد" وابدأ تسجّل من إعدادات استهلاك البيانات في تليفونك.</p></div>';
      return;
    }

    var maxTotal = Math.max.apply(null, names.map(function(n){ return groups[n].total; }));

    names.forEach(function(name){
      var g = groups[name];
      var limit = limits[name];
      var pct = limit ? Math.min(100, (g.total/limit)*100) : Math.min(100, (g.total/(maxTotal||1))*100);

      var status = "";
      var metaClass = "";
      if(limit){
        if(g.total >= limit){ status = "تجاوز الحد المحدد ⚠️"; metaClass = "danger"; }
        else if(g.total >= limit*0.85){ status = "قريب من الحد المحدد"; metaClass = "warn"; }
        else { status = "الحد: " + fmt(limit); }
      } else {
        status = "آخر تسجيل: " + g.lastDate;
      }

      var color = metaClass === "danger" ? "var(--danger)" : (metaClass === "warn" ? "var(--warn)" : "var(--signal)");
      var circumference = 2 * Math.PI * 22;
      var offset = circumference - (pct/100)*circumference;

      var card = document.createElement("div");
      card.className = "app-card";
      card.innerHTML =
        '<div class="app-dial">' +
          '<svg width="52" height="52" viewBox="0 0 52 52">' +
            '<circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="4"/>' +
            '<circle cx="26" cy="26" r="22" fill="none" stroke="'+color+'" stroke-width="4" ' +
              'stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'" stroke-linecap="round"/>' +
          '</svg>' +
          '<span class="app-dial-icon">' + iconFor(name) + '</span>' +
        '</div>' +
        '<div class="app-info">' +
          '<div class="app-name">' + escapeHtml(name) + '</div>' +
          '<div class="app-meta ' + metaClass + '">' + status + '</div>' +
        '</div>' +
        '<div class="app-amount">' + fmt(g.total).replace(" ", '<span class="u"> ') + '</span></div>';

      card.addEventListener("click", function(){ openDetail(name); });
      container.appendChild(card);
    });
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ===== Period tabs =====
  document.querySelectorAll(".period-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".period-tab").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      currentPeriod = tab.dataset.period;
      render();
    });
  });

  // ===== Add entry sheet =====
  var addOverlay = document.getElementById("addOverlay");
  document.getElementById("openAdd").addEventListener("click", function(){
    document.getElementById("appNameInput").value = "";
    document.getElementById("amountInput").value = "";
    document.getElementById("dateInput").value = todayISO();
    addOverlay.classList.add("show");
  });
  document.getElementById("cancelAdd").addEventListener("click", function(){
    addOverlay.classList.remove("show");
  });
  addOverlay.addEventListener("click", function(e){
    if(e.target === addOverlay) addOverlay.classList.remove("show");
  });

  document.getElementById("saveEntry").addEventListener("click", function(){
    var name = document.getElementById("appNameInput").value.trim();
    var amount = parseFloat(document.getElementById("amountInput").value);
    var unit = document.getElementById("unitInput").value;
    var date = document.getElementById("dateInput").value || todayISO();

    if(!name){ toast("اكتب اسم التطبيق"); return; }
    if(!amount || amount <= 0){ toast("اكتب كمية صحيحة"); return; }

    entries.push({ app: name, amount: amount, unit: unit, date: date, id: Date.now() });
    save();
    render();
    addOverlay.classList.remove("show");
    toast("تم الحفظ ✓");
  });

  // ===== Detail sheet =====
  var detailOverlay = document.getElementById("detailOverlay");
  function openDetail(name){
    activeAppForDetail = name;
    document.getElementById("detailName").textContent = name;
    document.getElementById("limitInput").value = limits[name] || "";
    detailOverlay.classList.add("show");
  }
  document.getElementById("closeDetail").addEventListener("click", function(){
    detailOverlay.classList.remove("show");
  });
  detailOverlay.addEventListener("click", function(e){
    if(e.target === detailOverlay) detailOverlay.classList.remove("show");
  });

  document.getElementById("saveLimit").addEventListener("click", function(){
    var val = parseFloat(document.getElementById("limitInput").value);
    if(val && val > 0){ limits[activeAppForDetail] = val; }
    else { delete limits[activeAppForDetail]; }
    save();
    render();
    detailOverlay.classList.remove("show");
    toast("تم حفظ الحد ✓");
  });

  document.getElementById("deleteApp").addEventListener("click", function(){
    entries = entries.filter(function(e){ return e.app !== activeAppForDetail; });
    delete limits[activeAppForDetail];
    save();
    render();
    detailOverlay.classList.remove("show");
    toast("تم الحذف");
  });

  render();
})();
</script>
</body>
</html>
